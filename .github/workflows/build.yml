name: Build desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64-experimental
          - os: macos-15-intel
            artifact: macos-x64-experimental
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest test_portable.py
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --name HeyouCapture --collect-all customtkinter --icon assets/heyou.ico --add-data "assets;assets" --add-data "automation.ps1;." app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/HeyouCapture -DestinationPath dist/HeyouCapture-Windows-x64.zip
      - name: Build experimental macOS
        if: runner.os == 'macOS'
        run: python build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
